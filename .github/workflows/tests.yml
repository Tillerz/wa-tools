# Runs all tests (tests/run-all.sh) on every push and pull request.
# The tests use a fake World Anvil API (tests/mock_wa_api.py), so they need no token and no network access.
# Nothing is published or deployed.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the requirements
        run: pip install -r requirements.txt
      - name: All tests
        run: ./tests/run-all.sh
