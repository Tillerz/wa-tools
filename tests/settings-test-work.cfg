# Like settings-test.cfg, but with a work folder for the article flow (edit, deploy, text-export).
# The backups, the articles and the list of articles stay in root_folder.
# Use it like this, from the repo folder:
#   python3 backup-articles.py --settings tests/settings-test-work.cfg

world_name = testworld
world_id = 00000000-0000-0000-0000-000000000000

x_auth_token = TEST_TOKEN
x_application_key = TEST_KEY

# the mock server from this folder
proxy = http://127.0.0.1:8099

# backups and the list of articles
root_folder = tests/out
# the work data: edit, deploy, text-export (an exact folder)
work_folder = tests/out/testworld.work

rate_limit_calls = 100
rate_limit_seconds = 1
