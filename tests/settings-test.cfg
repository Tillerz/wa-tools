# Settings for the mock API in this folder. Never points at the real World Anvil.
# Use it like this, from the backup folder:
#   python3 backup-maps.py --settings tests/settings-test.cfg

world_name = testworld
world_id = 00000000-0000-0000-0000-000000000000

x_auth_token = TEST_TOKEN
x_application_key = TEST_KEY

# the mock server from this folder
proxy = http://127.0.0.1:8099

# everything lands here, relative to the backup folder
root_folder = tests/out

# the mock has no rate limit, so do not slow the tests down
rate_limit_calls = 100
rate_limit_seconds = 1
